name: 'Build with release'

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'
      - name: Install dependencies
        run: npm ci
        working-directory: ./ui
      - name: Run linter
        run: npm run lint
        working-directory: ./ui
      - name: Run tests
        run: npm test
        working-directory: ./ui
      - name: Build UI
        run: npm run build
        working-directory: ./ui
      - name: Upload UI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 5

  build-binary:
    runs-on: ubuntu-latest
    needs: build-ui
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'backend/go.mod'
          cache-dependency-path: 'backend/go.sum'
      - name: Download UI artifact
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: backend/embed/ui
      - name: Tidy Go modules
        run: go mod tidy
        working-directory: ./backend
      - name: Install UPX
        if: matrix.goos == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPX_VERSION=$(gh release view --repo upx/upx --json tagName --jq '.tagName' | sed 's/^v//')
          test -n "$UPX_VERSION"
          wget -q "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz" -O /tmp/upx.tar.xz
          tar -xf /tmp/upx.tar.xz -C /tmp
          sudo cp /tmp/upx-*/upx /usr/local/bin/
          upx --version
        # shell: bash is required here: the default shell is `bash -e` without
        # pipefail, so a failing `gh` would be masked by `sed` and surface as a
        # bogus wget 404 instead of the real error.
        shell: bash
      - name: Build binary
        working-directory: ./backend
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          env GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -ldflags="-s -w" -o als-${{ matrix.goos }}-${{ matrix.goarch }}${ext}
      - name: Compress with UPX
        if: matrix.goos == 'linux'
        run: |
          which upx && upx -9 backend/als-linux-${{ matrix.goarch }} || echo "UPX compression skipped"
        shell: bash
      - name: Generate checksum
        # Must run AFTER "Compress with UPX": UPX rewrites the binary in
        # place, so a checksum taken before compression would never match
        # the asset users actually download. This step used to be ordered
        # before the UPX step, which left the linux .sha256 files wrong
        # for every release (verified on v2.8.0 and v2.8.1: linux-amd64
        # and linux-arm64 failed `sha256sum -c`, while darwin/windows
        # passed because they are never compressed).
        working-directory: ./backend
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          sha256sum als-${{ matrix.goos }}-${{ matrix.goarch }}${ext} > als-${{ matrix.goos }}-${{ matrix.goarch }}${ext}.sha256
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            backend/als-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
            backend/als-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
